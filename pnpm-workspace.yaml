packages:
  - apps/*
  - packages/*

# PDF.js is browser-only here. Its optional Node canvas is not used.
overrides:
  "pdfjs-dist@6.3.289>@napi-rs/canvas": "-"
  # Temporary reviewed fix for GHSA-vfj7-8cjw-p6xm. Remove after upstream ships a patched release.
  braces: "file:./vendor/braces"
  # Patched release for GHSA-68fv-2mgg-jv7q across Next/PostCSS, Tailwind and test tooling.
  source-map-js: "1.2.2"
  # Patched release for GHSA-wq5f-xc86-pv6w within Next's compatible optional range.
  sharp: "0.35.5"
  # Patched release for GHSA-587h-7wmj-h5pm (launch-editor path check). vite is reached only through vitest (test tooling).
  vite: "8.3.4"
  # Patched release for GHSA-mrhx-c7xc-m3w5 (memory exhaustion validating oversized collections). zod is reached only through eslint-config-next (lint tooling); no shipped code uses it.
  zod: "4.6.7"
  # Patched release for five undici advisories (GHSA-xjj6-f33q-929c, GHSA-qq8j-7v2v-3rwp, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm; all in undici's HTTP, TLS and WebSocket clients). undici is reached only through vitest > jsdom (test tooling); no shipped code uses it.
  undici: "8.12.2"

# These are the only dependency install scripts required by this foundation.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

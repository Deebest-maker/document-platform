name: M0 verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @document-platform/web exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/processor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: services/processor/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv audit --locked

  processor-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag document-platform-processor:m0 services/processor
      - name: Verify restricted container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name processor-m0 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 256m --cpus 1 \
            --pids-limit 64 --publish 127.0.0.1:8000:8000 document-platform-processor:m0
          trap 'docker logs processor-m0; docker rm --force processor-m0' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 http://127.0.0.1:8000/health/live \
            | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(docker exec processor-m0 id -u)" = "10001"
          docker exec processor-m0 /app/.venv/bin/python -c \
            'import importlib.util; assert importlib.util.find_spec("pytest") is None'

name: M0 verification

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Every job runs on a pinned runner image, so CI changes only when we choose.
# (The `ubuntu-latest` label began moving to Ubuntu 26 on 19 October 2026; move
# to a newer image once Playwright documents support for it.)
jobs:
  # The web checks are split so that each browser runs in its own job (the
  # single job had grown to within a minute of its 15 minute limit) and so a
  # failure names the browser. The job called `web` stays as the one required
  # status check on main: it passes only if every job it depends on passed.
  web-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  web-e2e:
    name: web-e2e (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run desktop and phone-width Chromium. Main, tags and
        # manual runs add Firefox and the two WebKit (Safari engine) projects.
        project: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '["chromium","mobile-chromium","firefox","webkit","mobile-webkit"]' || '["chromium","mobile-chromium"]') }}
    env:
      PDF_BROWSER_MATRIX: ${{ contains(fromJSON('["firefox","webkit","mobile-webkit"]'), matrix.project) && 'full' || 'smoke' }}
      BROWSER: ${{ contains(matrix.project, 'webkit') && 'webkit' || (contains(matrix.project, 'firefox') && 'firefox' || 'chromium') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser install failed repeatedly on 22 October with no code at
      # fault, because Ubuntu package mirrors stalled or refused. The script
      # tries up to three times, alternating mirrors, and prints what went wrong
      # as warnings on the check run (see the comments in the script).
      - name: Install the browser
        run: bash scripts/ci-install-browser.sh "$BROWSER"
      - run: pnpm build
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - name: Report failing browser tests on the check run
        if: ${{ !cancelled() }}
        run: node scripts/ci-playwright-annotations.mjs apps/web/test-results/results.json
      - run: pnpm test:foundation --project=${{ matrix.project }}
        if: ${{ !cancelled() }}
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  web:
    needs: [web-quality, web-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every web job must have passed
        env:
          QUALITY: ${{ needs.web-quality.result }}
          E2E: ${{ needs.web-e2e.result }}
        run: |
          echo "web-quality: $QUALITY"
          echo "web-e2e: $E2E"
          test "$QUALITY" = "success" && test "$E2E" = "success"

  processor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/processor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: services/processor/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv audit --locked

  processor-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag document-platform-processor:m0 services/processor
      - name: Verify restricted container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name processor-m0 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --memory 256m --cpus 1 \
            --pids-limit 64 --publish 127.0.0.1:8000:8000 document-platform-processor:m0
          trap 'docker logs processor-m0; docker rm --force processor-m0' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 http://127.0.0.1:8000/health/live \
            | python -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok"}'
          test "$(docker exec processor-m0 id -u)" = "10001"
          docker exec processor-m0 /app/.venv/bin/python -c \
            'import importlib.util; assert importlib.util.find_spec("pytest") is None'
